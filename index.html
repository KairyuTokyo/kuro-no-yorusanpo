<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#061632"><title>クロとまったりハチワレさん 流氷RUN</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#031735;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}#ui{position:fixed;inset:0;pointer-events:none;color:#fff}.hud{position:absolute;top:max(16px,env(safe-area-inset-top));left:18px;font-weight:900;font-size:18px;line-height:1.25;text-shadow:0 3px 0 #001}.clock{position:absolute;top:max(16px,env(safe-area-inset-top));right:18px;font-weight:900;font-size:20px;padding:5px 10px;border:2px solid #ffffff99;border-radius:7px;background:#00152c99;text-shadow:0 2px 0 #001}.hint{position:absolute;bottom:max(26px,env(safe-area-inset-bottom));width:100%;text-align:center;font-weight:800;text-shadow:0 3px 0 #001}.title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#031735cc;pointer-events:auto;text-align:center;padding:24px}.title h1{font-size:32px;margin:0 0 10px}.title p{margin:0 0 22px;line-height:1.5}.btn{border:0;border-radius:999px;padding:14px 42px;background:#ef6486;color:white;font-size:20px;font-weight:900;box-shadow:0 5px 0 #9d3651}.hidden{display:none}</style></head><body><canvas id="c"></canvas><div id="ui"><div class="hud">SCORE <span id="s">0</span><br>BEST <span id="b">0</span></div><div class="clock" id="clock">--:--</div><div class="hint" id="hint">画面をタップしてジャンプ</div><div class="title" id="title"><h1>流氷RUN</h1><p>クロとまったりハチワレさんを流氷から流氷へ。<br>海へ落ちたら即凍結 GAME OVER。</p><button class="btn" id="start">スタート</button></div></div><script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),S=document.getElementById('s'),B=document.getElementById('b'),T=document.getElementById('title'),clock=document.getElementById('clock');let W,H,dpr,run=false,score=0,best=+localStorage.kuroIceBest||0,frame=0,speed=8.2,platforms=[],tunas=[],stars=[];B.textContent=best;const cat={x:90,y:0,w:78,h:54,vy:0,on:false};const mate={x:30,y:0,w:58,h:42,vy:0};function resize(){dpr=Math.min(devicePixelRatio,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);if(!stars.length)for(let i=0;i<80;i++)stars.push({x:Math.random()*W,y:Math.random()*H*.58,r:Math.random()*1.6+.4})}addEventListener('resize',resize);resize();function updateClock(){clock.textContent=new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',hour12:false})}updateClock();setInterval(updateClock,1000);
function reset(){run=true;score=0;frame=0;speed=8.2;platforms=[];tunas=[];let y=H*.73;platforms.push({x:-40,y,w:W*.62,h:75});platforms.push({x:W*.72,y:y+8,w:W*.42,h:70});cat.y=y-cat.h;cat.vy=0;cat.on=true;mate.y=y-mate.h;mate.vy=0;S.textContent=0}function jump(){if(run&&cat.on){cat.vy=-18.2;cat.on=false;mate.vy=-17.2}}addEventListener('pointerdown',e=>{if(!e.target.closest('button'))jump()});document.getElementById('start').onclick=()=>{T.classList.add('hidden');reset()};
function over(){if(!run)return;run=false;best=Math.max(best,Math.floor(score));localStorage.kuroIceBest=best;B.textContent=best;T.innerHTML=`<h1>🧊 GAME OVER</h1><p>海水で即凍結。<br>SCORE ${Math.floor(score)}　BEST ${best}</p><button class="btn" id="again">もう一度</button>`;T.classList.remove('hidden');document.getElementById('again').onclick=()=>{T.classList.add('hidden');reset()}}
function bg(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#031338');g.addColorStop(.65,'#07518a');g.addColorStop(1,'#012b54');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.globalAlpha=.9;for(const s of stars){ctx.fillStyle='#fff';ctx.fillRect(s.x,s.y,s.r,s.r)}ctx.globalAlpha=1; // aurora
for(let k=0;k<3;k++){ctx.strokeStyle=['#39f5c7aa','#37c8ffaa','#8c54ffaa'][k];ctx.lineWidth=18-k*3;ctx.beginPath();for(let x=0;x<=W;x+=18){let y=H*(.14+.08*k)+Math.sin(x/90+k)*34;if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.stroke()} // moon
ctx.fillStyle='#fff0a8';ctx.beginPath();ctx.arc(W*.82,H*.16,34,0,Math.PI*2);ctx.fill(); // constellation
ctx.strokeStyle='#ffffffaa';ctx.lineWidth=1;ctx.beginPath();let pts=[[W*.55,H*.12],[W*.59,H*.09],[W*.62,H*.14],[W*.66,H*.1]];pts.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.stroke();for(const p of pts){ctx.fillStyle='#fff';ctx.fillRect(p[0]-2,p[1]-2,4,4)} // shooting stars
for(let i=0;i<3;i++){let sx=(frame*(2+i*.5)+i*240)%(W+220)-110,sy=H*(.25+i*.09);ctx.strokeStyle='#fff7a8';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx-42,sy-20);ctx.stroke()} // mountains
ctx.fillStyle='#b8e9ff';ctx.beginPath();ctx.moveTo(0,H*.67);for(let x=0;x<=W;x+=90)ctx.lineTo(x,H*.67-(x%180?75:35));ctx.lineTo(W,H*.75);ctx.lineTo(0,H*.75);ctx.fill();ctx.fillStyle='#003f73';ctx.fillRect(0,H*.73,W,H*.27);}
function ice(p){ctx.fillStyle='#eafcff';ctx.fillRect(p.x,p.y,p.w,p.h*.22);ctx.fillStyle='#75d7ff';ctx.beginPath();ctx.moveTo(p.x,p.y+p.h*.2);ctx.lineTo(p.x+p.w,p.y+p.h*.2);ctx.lineTo(p.x+p.w-12,p.y+p.h);ctx.lineTo(p.x+14,p.y+p.h);ctx.closePath();ctx.fill();ctx.strokeStyle='#baf4ff';ctx.lineWidth=3;ctx.strokeRect(p.x,p.y,p.w,p.h*.22)}
function drawCat(o,gray=false){let x=o.x,y=o.y,w=o.w,h=o.h;ctx.fillStyle=gray?'#a9abb0':'#08090d';ctx.beginPath();ctx.ellipse(x+w*.47,y+h*.58,w*.43,h*.32,0,0,7);ctx.fill();ctx.beginPath();ctx.arc(x+w*.69,y+h*.38,h*.3,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(x+w*.56,y+h*.18);ctx.lineTo(x+w*.62,y-h*.05);ctx.lineTo(x+w*.7,y+h*.2);ctx.moveTo(x+w*.74,y+h*.18);ctx.lineTo(x+w*.86,y-h*.03);ctx.lineTo(x+w*.9,y+h*.26);ctx.fill();ctx.strokeStyle=gray?'#666':'#08090d';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(x+w*.12,y+h*.55);ctx.quadraticCurveTo(x-w*.12,y+h*.2,x+w*.06,y+h*.08);ctx.stroke();ctx.fillStyle=gray?'#f8f8f8':'#42ccff';ctx.beginPath();ctx.arc(x+w*.68,y+h*.36,5,0,7);ctx.arc(x+w*.8,y+h*.35,5,0,7);ctx.fill();ctx.fillStyle='#ff7a82';ctx.beginPath();ctx.arc(x+w*.75,y+h*.48,2.5,0,7);ctx.fill();if(gray){ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(x+w*.53,y+h*.62,w*.25,h*.22,0,0,7);ctx.fill();ctx.strokeStyle='#d32634';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(x+w*.45,y+h*.35);ctx.lineTo(x+w*.78,y+h*.55);ctx.stroke()}}
function tuna(f){ctx.fillStyle='#174e86';ctx.beginPath();ctx.ellipse(f.x+30,f.y+14,28,12,0,0,7);ctx.fill();ctx.fillStyle='#dfefff';ctx.beginPath();ctx.ellipse(f.x+34,f.y+17,22,7,0,0,7);ctx.fill();ctx.fillStyle='#e5b72b';ctx.beginPath();ctx.moveTo(f.x+3,f.y+14);ctx.lineTo(f.x-13,f.y+1);ctx.lineTo(f.x-13,f.y+27);ctx.fill();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(f.x+48,f.y+11,2,0,7);ctx.fill()}
function loop(){requestAnimationFrame(loop);frame++;bg();if(run){score+=.09;speed=8.2+Math.min(3.5,score/180);cat.vy+=1.35;cat.y+=cat.vy;mate.vy+=1.35;mate.y+=mate.vy;cat.on=false;for(const p of platforms){p.x-=speed;if(cat.vy>=0&&cat.x+cat.w*.8>p.x&&cat.x+cat.w*.2<p.x+p.w&&cat.y+cat.h>=p.y&&cat.y+cat.h<=p.y+20){cat.y=p.y-cat.h;cat.vy=0;cat.on=true}if(mate.vy>=0&&mate.x+mate.w>p.x&&mate.x<p.x+p.w&&mate.y+mate.h>=p.y&&mate.y+mate.h<=p.y+24){mate.y=p.y-mate.h;mate.vy=0}}platforms=platforms.filter(p=>p.x+p.w>-60);let last=platforms[platforms.length-1];if(last&&last.x+last.w<W+100){let gap=90+Math.random()*105,w=145+Math.random()*160,y=H*.70+Math.random()*45;platforms.push({x:last.x+last.w+gap,y,w,h:60+Math.random()*30});if(Math.random()<.65)tunas.push({x:last.x+last.w+gap+w*.45,y:y-55,w:60,h:30})}for(const f of tunas)f.x-=speed;tunas=tunas.filter(f=>f.x>-80);for(let i=tunas.length-1;i>=0;i--){let f=tunas[i];if(cat.x+cat.w>f.x&&cat.x<f.x+60&&cat.y+cat.h>f.y&&cat.y<f.y+30){score+=35;tunas.splice(i,1)}}if(cat.y>H*.86)over();if(mate.y>H*.88){mate.y=cat.y+10;mate.vy=cat.vy}S.textContent=Math.floor(score)}for(const p of platforms)ice(p);for(const f of tunas)tuna(f);drawCat(mate,true);drawCat(cat,false)}loop();
</script></body></html>
