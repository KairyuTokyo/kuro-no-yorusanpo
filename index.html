<!doctype html><html lang='ja'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no'><meta name='apple-mobile-web-app-capable' content='yes'><meta name='theme-color' content='#061632'><title>クロの夜さんぽ</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#061632;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}#ui{position:fixed;inset:0;pointer-events:none;color:white}.score{position:absolute;top:max(18px,env(safe-area-inset-top));left:20px;font-weight:800;text-shadow:0 2px 5px #000;font-size:18px}.hint{position:absolute;bottom:max(28px,env(safe-area-inset-bottom));width:100%;text-align:center;font-weight:700;text-shadow:0 2px 5px #000}.title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(#06163288,#061632cc);pointer-events:auto}.title h1{font-size:38px;margin:0 0 8px}.title p{margin:0 0 24px}.btn{border:0;border-radius:999px;padding:14px 42px;background:#ef6486;color:#fff;font-size:20px;font-weight:800;box-shadow:0 5px 20px #0006}.hidden{display:none}</style></head><body><canvas id='c'></canvas><div id='ui'><div class='score'>SCORE <span id='s'>0</span><br>BEST <span id='b'>0</span></div><div class='hint' id='hint'>画面をタップしてジャンプ</div><div class='title' id='title'><h1>クロの夜さんぽ 🐾</h1><p>おさかなを集めて、箱を飛び越えよう</p><button class='btn' id='start'>スタート</button></div></div><script>
const c=document.getElementById('c'),x=c.getContext('2d'),S=document.getElementById('s'),B=document.getElementById('b'),T=document.getElementById('title'),H=document.getElementById('hint');let W,Hh,dpr,run=false,dead=false,score=0,best=+localStorage.kuroBest||0,t=0,obs=[],fish=[],speed=7;B.textContent=best;const cat={x:70,y:0,w:58,h:48,vy:0};function resize(){dpr=Math.min(devicePixelRatio,2);W=innerWidth;Hh=innerHeight;c.width=W*dpr;c.height=Hh*dpr;x.setTransform(dpr,0,0,dpr,0,0);cat.y=Hh-130-cat.h}addEventListener('resize',resize);resize();function jump(){if(!run)return;if(cat.y>=Hh-130-cat.h-2)cat.vy=-15.5}addEventListener('pointerdown',e=>{if(e.target.id!=='start')jump()});document.getElementById('start').onclick=()=>{T.classList.add('hidden');reset()};function reset(){run=true;dead=false;score=0;t=0;speed=7;obs=[];fish=[];cat.y=Hh-130-cat.h;cat.vy=0;H.textContent='画面をタップしてジャンプ'}function hit(a,b){const padX=8,padY=5;return a.x+padX<b.x+b.w&&a.x+a.w-padX>b.x&&a.y+padY<b.y+b.h&&a.y+a.h-padY>b.y}function over(){if(!run)return;run=false;dead=true;best=Math.max(best,Math.floor(score));localStorage.kuroBest=best;B.textContent=best;T.innerHTML=`<h1>GAME OVER</h1><p>SCORE ${Math.floor(score)}　BEST ${best}</p><button class='btn' id='again'>もう一度</button>`;T.classList.remove('hidden');document.getElementById('again').onclick=()=>{T.classList.add('hidden');reset()}}
function bg(){let g=x.createLinearGradient(0,0,0,Hh);g.addColorStop(0,'#061632');g.addColorStop(1,'#1b4c72');x.fillStyle=g;x.fillRect(0,0,W,Hh);x.fillStyle='#fff';for(let i=0;i<45;i++){let sx=(i*83)%W,sy=(i*47)%(Hh*.55);x.globalAlpha=.35+(i%5)/8;x.fillRect(sx,sy,2,2)}x.globalAlpha=1;x.fillStyle='#fff2b8';x.beginPath();x.arc(W*.78,Hh*.16,32,0,7);x.fill();x.fillStyle='#173650';x.beginPath();x.moveTo(0,Hh-190);for(let i=0;i<=W;i+=60)x.lineTo(i,Hh-190-(i%120?35:5));x.lineTo(W,Hh);x.lineTo(0,Hh);x.fill();x.fillStyle='#3e4657';x.fillRect(0,Hh-130,W,130);x.fillStyle='#697080';for(let i=0;i<W;i+=55)x.fillRect(i,Hh-128,50,8)}
function drawCat(){let y=cat.y;x.fillStyle='#0b0c12';x.beginPath();x.ellipse(cat.x+30,y+28,29,21,0,0,7);x.fill();x.beginPath();x.arc(cat.x+38,y+17,19,0,7);x.fill();x.beginPath();x.moveTo(cat.x+24,y+5);x.lineTo(cat.x+29,y-9);x.lineTo(cat.x+36,y+5);x.moveTo(cat.x+42,y+3);x.lineTo(cat.x+52,y-8);x.lineTo(cat.x+55,y+8);x.fill();x.fillStyle='#e55c62';x.beginPath();x.moveTo(cat.x+29,y+1);x.lineTo(cat.x+31,y-6);x.lineTo(cat.x+35,y+3);x.fill();x.fillStyle='#36c8ff';x.beginPath();x.arc(cat.x+34,y+16,4.5,0,7);x.arc(cat.x+47,y+15,4.5,0,7);x.fill();x.fillStyle='white';x.beginPath();x.arc(cat.x+35,y+14,1.5,0,7);x.arc(cat.x+48,y+13,1.5,0,7);x.fill();x.fillStyle='#e56b6b';x.beginPath();x.arc(cat.x+41,y+22,2,0,7);x.fill();x.fillStyle='#0b0c12';x.beginPath();x.arc(cat.x+6,y+31,13,0,7);x.fill()}
function loop(){requestAnimationFrame(loop);bg();if(run){t++;score+=.06;speed=7+Math.min(5,score/180);cat.vy+=.82;cat.y+=cat.vy;let floor=Hh-130-cat.h;if(cat.y>floor){cat.y=floor;cat.vy=0}if(t%Math.max(62,Math.floor(108-speed*3))===0)obs.push({x:W+20,y:Hh-174,w:42,h:44});if(t%150===60)fish.push({x:W+20,y:Hh-225,w:30,h:20});for(let o of obs)o.x-=speed;for(let f of fish)f.x-=speed;obs=obs.filter(o=>o.x>-60);fish=fish.filter(f=>f.x>-50);for(let o of obs){if(hit(cat,o)){over();break}}if(run)for(let i=fish.length-1;i>=0;i--)if(hit(cat,fish[i])){score+=25;fish.splice(i,1)}S.textContent=Math.floor(score)}for(let o of obs){x.fillStyle='#9a663d';x.fillRect(o.x,o.y,o.w,o.h);x.strokeStyle='#5d3824';x.lineWidth=3;x.strokeRect(o.x,o.y,o.w,o.h);x.beginPath();x.moveTo(o.x,o.y);x.lineTo(o.x+o.w,o.y+o.h);x.moveTo(o.x+o.w,o.y);x.lineTo(o.x,o.y+o.h);x.stroke()}for(let f of fish){x.fillStyle='#ffd33d';x.beginPath();x.ellipse(f.x+15,f.y+10,12,7,0,0,7);x.moveTo(f.x+3,f.y+10);x.lineTo(f.x-7,f.y+2);x.lineTo(f.x-7,f.y+18);x.fill();x.fillStyle='#5b4a20';x.beginPath();x.arc(f.x+20,f.y+8,1.5,0,7);x.fill()}drawCat()}loop();
</script></body></html>
